name: Compiler Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.11.1

      - name: Verifier Tcl/Tk avant compilation
        run: python verifier_tk.py --avant

      - name: PyInstaller dossier comme Ppix
        run: |
          pyi-makespec --noconfirm --windowed --onedir --noupx --collect-all tkinter --name MEDICONF --hidden-import pypdf --hidden-import pypdfium2 --hidden-import ocr --hidden-import PIL --hidden-import reportlab --hidden-import menu --hidden-import reception --hidden-import patches_ui --hidden-import explorateur --hidden-import conversion --hidden-import parametres --hidden-import apercu --hidden-import apercu_image --hidden-import scan_source --collect-all PIL --runtime-hook rthook_tk.py boot.py
          python ajuster_spec.py
          pyinstaller --noconfirm --clean MEDICONF.spec

      - name: Verifier Tcl/Tk dans le dossier compile
        run: python verifier_tk.py --apres

      - name: Zip du dossier
        run: python faire_zip.py

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: MEDICONF-Windows
          path: MEDICONF-windows.zip
