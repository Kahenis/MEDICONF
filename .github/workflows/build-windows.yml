name: Compiler Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.11.1

      - name: PyInstaller dossier comme Ppix
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --noupx --collect-all tkinter --name MEDICONF --hidden-import pypdf --hidden-import pypdfium2 --hidden-import ocr --hidden-import PIL --hidden-import reportlab --hidden-import menu --hidden-import reception --hidden-import patches_ui --hidden-import explorateur --hidden-import conversion --hidden-import parametres --hidden-import apercu --hidden-import scan_source --hidden-import app boot.py
          python verifier_tk.py

      - name: Zip du dossier
        shell: pwsh
        run: |
          Compress-Archive -Path dist\MEDICONF -DestinationPath MEDICONF-windows.zip -Force

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: MEDICONF-Windows
          path: MEDICONF-windows.zip
